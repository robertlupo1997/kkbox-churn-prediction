name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.1.6 black==23.11.0

      - name: Run Ruff linter
        run: python -m ruff check src/ tests/ --output-format=github

      - name: Check Black formatting
        run: python -m black --check --diff src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate synthetic test fixtures
        run: python tests/fixtures/generate_synthetic.py

      - name: Run full test suite
        run: python -m pytest tests/ -rs --tb=short

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create output directories
        run: mkdir -p models features eval

      - name: Generate synthetic test fixtures
        run: python tests/fixtures/generate_synthetic.py

      - name: Generate features (synthetic)
        run: python src/features_processor.py

      - name: Train models (synthetic)
        run: python train_models.py

      - name: Calibrate models
        run: python src/calibration.py --features features/features_processed.csv

      - name: Integration tests
        run: python test_integration.py

      - name: Backtests (synthetic)
        run: make backtest-ci

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-artifacts
          path: |
            models/*.pkl
            models/*.json
            models/training_metrics.json
          retention-days: 7

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-artifacts
          path: |
            eval/*.csv
            features/features_processed.csv
          retention-days: 7

  frontend:
    # Builds the dashboard both ways it ships (API mode for the Docker image,
    # static mode for the hosted demo) and drives the static build in a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brutalist-aesthetic-kkbox-churn-analysis-pro/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd brutalist-aesthetic-kkbox-churn-analysis-pro && npm ci --legacy-peer-deps

      - name: Build (API mode)
        working-directory: brutalist-aesthetic-kkbox-churn-analysis-pro
        run: npm run build

      - name: Build (static mode)
        run: scripts/build_static_site.sh "$PWD/static-site"

      - name: Drive the static build in a browser
        working-directory: brutalist-aesthetic-kkbox-churn-analysis-pro
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 -d ../static-site > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          cp ../scripts/verify/drive-static.mjs ./drive-static.mjs
          node drive-static.mjs http://127.0.0.1:8080 "$RUNNER_TEMP"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-demo-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
