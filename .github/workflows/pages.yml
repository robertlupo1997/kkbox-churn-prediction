name: static demo (GitHub Pages)

# Builds the dashboard in static mode (no server; every score precomputed by the
# served model), checks it in a real browser, and publishes it to GitHub Pages.
#
# Manual only. Nothing here runs on push or merge: publishing is a deliberate act
# (issue #25). Before the first run, set the repository's Pages source to
# "GitHub Actions" and, for a custom domain, enter it under Settings -> Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brutalist-aesthetic-kkbox-churn-analysis-pro/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: brutalist-aesthetic-kkbox-churn-analysis-pro
        run: npm ci --legacy-peer-deps

      - name: Build static site
        run: scripts/build_static_site.sh "$PWD/static-site"

      - name: Check it in a browser before publishing
        working-directory: brutalist-aesthetic-kkbox-churn-analysis-pro
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 -d ../static-site > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          cp ../scripts/verify/drive-static.mjs ./drive-static.mjs
          node drive-static.mjs http://127.0.0.1:8080 "$RUNNER_TEMP"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
