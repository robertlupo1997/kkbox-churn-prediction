# The dashboard requests relative /api/* paths. That is correct and deliberate:
# on Hugging Face Spaces one uvicorn serves both the bundle and the API from a
# single origin, so a relative base is what makes the Space work.
#
# docker-compose splits them into two containers. Without a proxy here, every
# /api/* request lands on this static-file server, which has no API behind it,
# and the dashboard reports the API unavailable while it is healthy on :8000.
# `serve` cannot proxy, which is why this container runs nginx.
#
# Do not "fix" this by baking VITE_API_URL into the build instead. That would
# make the compose bundle differ from the one that ships to the Space, and the
# local run would stop being evidence about the deployed artifact.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths resolve to the bundle, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API container, by its compose service name.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SHAP for a cold member can outrun the default 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
